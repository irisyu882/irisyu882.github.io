<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The design portfolio of Iris Yu.">
<title>Iris Yu · Design Portfolio</title>
<style>
  :root { color-scheme: light; font-family: system-ui, sans-serif; color: #24231e; background: #f8f6ef; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: inherit; text-underline-offset: .3em; }
  header, main, footer { width: min(100% - 3rem, 68rem); margin: auto; }
  header, footer { display: flex; justify-content: space-between; gap: 1rem; padding: 1.5rem 0; }
  header { border-bottom: 1px solid #d7d4ca; }
  .hero { padding: clamp(4rem, 12vw, 10rem) 0 clamp(3rem, 8vw, 6rem); }
  .label { font-size: .75rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  h1 { font: 400 clamp(4rem, 13vw, 10rem)/.9 Georgia, serif; letter-spacing: -.075em; margin: .18em 0; }
  .intro { font-size: clamp(1.2rem, 3vw, 1.75rem); }
  .work { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); background: #e8ebdd; border-radius: 1rem; overflow: hidden; }
  .copy { align-self: center; padding: clamp(1.5rem, 5vw, 4rem); }
  h2 { font: 400 clamp(2rem, 5vw, 3.5rem)/1 Georgia, serif; margin: .4em 0; }
  .art { min-height: 17rem; display: grid; place-items: center; background: #d8e1c8; }
  svg { width: min(80%, 20rem); height: auto; }
  footer { margin-top: 2rem; font-size: .85rem; }
</style>
</head>
<body>
<header><strong>Iris Yu</strong><a href="#work">Work</a></header>
<main id="top">
  <section class="hero" aria-labelledby="title">
    <p class="label">Design portfolio</p>
    <h1 id="title">Iris Yu</h1>
    <p class="intro">A home for my design work.</p>
  </section>
  <section class="work" id="work" aria-labelledby="work-title">
    <div class="copy">
      <p class="label">Portfolio in progress</p>
      <h2 id="work-title">Selected work</h2>
      <p>Project case studies are coming soon.</p>
    </div>
    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 320 240" fill="none">
        <circle cx="108" cy="120" r="76" fill="#f7f3dc"/>
        <circle cx="212" cy="120" r="76" fill="#789267"/>
        <path d="M160 65a76 76 0 0 1 0 110 76 76 0 0 1 0-110Z" fill="#344b39"/>
      </svg>
    </div>
  </section>
</main>
<footer><span>Iris Yu</span><a href="#top">Back to top ↑</a></footer>
</body>
</html>
